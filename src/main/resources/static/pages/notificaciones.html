<head>

      window.location.href = "/pages/login.html"
    }
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notificaciones | InstaRama</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="../assets/css/base/contactanos.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="../assets/css/base/styles.css" />
  <link rel="stylesheet" href="../assets/css/base/paleta.css" />
  <link rel="stylesheet" href="../assets/css/base/global.css" />
  <link rel="stylesheet" href="../assets/css/pages/notificaciones.css">

</head>

<body class="feed-layout">

<aside class="ir-sidebar" id="ir-sidebar">
  <!-- Solo en celular, donde el sidebar es un menú lateral -->
  <button type="button" class="ir-menu-cerrar" aria-label="Cerrar menú">✕</button>
  <h1 class="ir-sidebar-title">InstaRama</h1>
  <a href="../pages/feed.html">
    <img src="../assets/img/logo/Logo contexto.svg" alt="Logo de InstaRama" class="ir-sidebar-logo" />
  </a>

  <a class="ir-sidebar-btn" href="../pages/publicacion.html">Crear publicación</a>
  <a class="ir-sidebar-btn is-active" aria-current="page" href="./notificaciones.html" >Notificaciones</a>

  <!-- Solo en celular: en escritorio estos enlaces están en la barra de arriba -->
  <nav class="ir-sidebar-cuenta" aria-label="Cuenta">
    <a class="ir-sidebar-btn" href="./gestionarPublicaciones.html">Mis publicaciones</a>
    <a class="ir-sidebar-btn" href="./perfil.html">Perfil</a>
    <a class="ir-sidebar-btn" href="../index.html" data-cerrar-sesion>Log out</a>
  </nav>

  <section class="ir-sidebar-box" aria-labelledby="tendencias">
    <h2 id="tendencias">Tendencias</h2>
    <!-- contenido futuro -->
  </section>

  <section class="ir-sidebar-box ir-sidebar-box--grow" aria-labelledby="recientes">
    <h2 id="recientes">Publicaciones recientes</h2>
    <!-- contenido futuro -->
  </section>

  <a class="ir-sidebar-btn ir-sidebar-contact" href="../pages/contacto.html">Contáctanos</a>

  <div class="ir-sidebar-footer">
    <a href="../pages/acercaDe.html" class="text-reset text-decoration-none">Acerca de</a>
    <span>Code&amp;Cell</span>
    <span>All rights reserved</span>
    <span>2026</span>
  </div>
</aside>

<main class="ir-main">
  <section class="ir-notif">
    <div class="ir-notif-encabezado d-flex justify-content-between align-items-center">
      <div class="ir-notif-titulo d-flex align-items-center gap-2">
        <svg class="ir-notif-icono" viewBox="0 0 24 24" width="32" height="32" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
        </svg>
        <h1 class="ir-notif-texto">Notificaciones</h1>
      </div>

      <button class="ir-notif-btn" type="button">
        Marcar todo como leído
      </button>
    </div>

    <div class="ir-notif-filtros
                d-flex justify-content-between align-items-center">
      <div class="ir-notif-pestanas
                  d-flex gap-2 flex-wrap">
        <button class="ir-notif-pestana is-active" aria-pressed="true" type="button">Todas</button>
        <button class="ir-notif-pestana" aria-pressed="false" type="button">
          No leídas (<span class="numero-notif-sin-leer">0</span>)
        </button>
        <button class="ir-notif-pestana" aria-pressed="false" type="button">Comentarios</button>
        <button class="ir-notif-pestana" aria-pressed="false" type="button">Reacciones</button>
        <button class="ir-notif-pestana" aria-pressed="false" type="button">Hallazgos</button>
      </div>

      <div class="ir-notif-ordenar d-flex align-items-center gap-2">
        <label for="ordenar-notif" class="mb-0">Ordenar:</label>
        <select id="ordenar-notif" class="form-select w-auto">
          <option value="recientes" selected>Más recientes</option>
          <option value="antiguas">Más antiguas</option>
          <option value="no-leidas">No leídas primero</option>
        </select>
      </div>
    </div>
  </section>



</main>

  <script src="../assets/js/core/main.js" type="module"></script>
  <script src="../assets/js/core/render.js" type="module"></script>

</body>

</html>
